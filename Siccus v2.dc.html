<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-f41adb54-a988-4e85-8302-adef7143909b/styles.css">
<script src="_ds/classical-f41adb54-a988-4e85-8302-adef7143909b/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Cedarville+Cursive&family=IM+Fell+English:ital@0;1&display=swap">
<style>
  html, body { margin:0; background:#dedad1; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent); }
  @keyframes sic-grow { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
  @keyframes sic-in { from { opacity: 0 } to { opacity: 1 } }
  #sic-word::placeholder { color: rgba(32,31,29,0.2); }
  #sic-word:focus-visible { outline: none; }
  .sic-act { transition: opacity .25s; }
  .sic-act:hover { opacity: 1 !important; }
  .sic-act:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }

<div style="min-height:100vh;background:#dedad1;display:flex;flex-direction:column;align-items:center;gap:24px;padding:34px 24px 44px;box-sizing:border-box;font-family:var(--font-body)">

    <input id="sic-word" type="text" spellcheck="false" autocomplete="off" value="{{ word }}" onInput="{{ onWord }}" onKeyDown="{{ onKey }}" onBlur="{{ commit }}" placeholder="un mot" style="width:100%;border:0;background:transparent;text-align:center;font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.15;color:#201f1d;padding:0 0 8px" />

  <div style="height:min(calc(100vh - 250px), 780px);aspect-ratio:297 / 420;max-width:100%;box-shadow:0 16px 44px rgba(45,43,43,0.24);background:#eee8db">

        </g>

      <g stroke="currentColor" fill="none" opacity="0.7">

        <path d="M20 30.6 H277" stroke-width="0.25" />

      {{ printed }}

      <g stroke="currentColor" fill="none" opacity="0.3" stroke-width="0.3" stroke-dasharray="1.4 1.6">
        <rect x="196" y="50" width="82" height="78" />
        <rect x="196" y="140" width="82" height="78" />
      </g>

      <g stroke="currentColor" fill="none" stroke-width="0.35" opacity="0.65">
        <path d="M196 292 H241" />
        <path d="M196 288.5 V295.5 M205 290 V294 M214 289.5 V294.5 M223 290 V294 M232 289.5 V294.5 M241 288.5 V295.5" />
      </g>

      <g stroke="currentColor" fill="none" opacity="0.65">
        <path d="M20 316 H277" stroke-width="0.7" />
        <path d="M20 318 H277" stroke-width="0.22" />
        <path d="M182 324 V404" stroke-width="0.22" opacity="0.55" />

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;gap:24px;align-items:center">
      <button type="button" class="sic-act" onClick="{{ exportSvg }}" style="opacity:0.42;border:0;background:transparent;cursor:pointer;font-family:var(--font-heading);font-size:12.5px;letter-spacing:0.22em;text-transform:uppercase;color:#201f1d;padding:4px 2px">SVG</button>
      <div style="width:1px;height:13px;background:rgba(32,31,29,0.2)"></div>
      <button type="button" class="sic-act" onClick="{{ exportPng }}" style="opacity:0.42;border:0;background:transparent;cursor:pointer;font-family:var(--font-heading);font-size:12.5px;letter-spacing:0.22em;text-transform:uppercase;color:#201f1d;padding:4px 2px">PNG</button>
    </div>
    <div style="display:flex;gap:18px;align-items:center">
      <button type="button" class="sic-act" onClick="{{ setMounted }}" style="opacity:{{ optMounted }};border:0;background:transparent;cursor:pointer;font-family:var(--font-body);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#201f1d;padding:2px">Planche montée</button>
      <button type="button" class="sic-act" onClick="{{ setBare }}" style="opacity:{{ optBare }};border:0;background:transparent;cursor:pointer;font-family:var(--font-body);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#201f1d;padding:2px">Feuille nue</button>
      <button type="button" class="sic-act" onClick="{{ setGrid }}" style="opacity:{{ optGrid }};border:0;background:transparent;cursor:pointer;font-family:var(--font-body);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#201f1d;padding:2px">Papier quadrillé</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;word&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Éléa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mounted&quot;,&quot;bare&quot;,&quot;grid&quot;],&quot;default&quot;:&quot;mounted&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* Siccus — planche d'herbier déterministe.
   Aucun Math.random() : tout dérive de xmur3(mot) → mulberry32(seed). */

const PALETTES = [
  { id:'sepia',  name:'sépia',        ink:'#4a3520', foliage:'#a3824e', paper:'#f0e6d1', hand:'#5b4126', hand2:'#3f4a54', stamp:'#6b4a2e' },
  { id:'olive',  name:'olive séché',  ink:'#3b402c', foliage:'#8b8a5e', paper:'#f1ecda', hand:'#48462f', hand2:'#3d4a4a', stamp:'#5c5c38' },
  { id:'encre',  name:'encre froide', ink:'#2b3340', foliage:'#798492', paper:'#e7e6e0', hand:'#33404f', hand2:'#4a4038', stamp:'#3d4b5c' },
  { id:'tabac',  name:'tabac',        ink:'#4d3524', foliage:'#a9713f', paper:'#eee1ca', hand:'#5f3f24', hand2:'#414a44', stamp:'#7a4c28' },
  { id:'fusain', name:'fusain',       ink:'#2e2e2c', foliage:'#84837e', paper:'#f1f0ea', hand:'#3a3a37', hand2:'#4b4640', stamp:'#43423e' }
];
const PORTS = [
  { id:'arbustif',  label:'port arbustif, rameux' },
  { id:'rosette',   label:'port en rosette, hampe florale' },
  { id:'graminee',  label:'port graminoïde, touffe' },
  { id:'grimpant',  label:'port grimpant, vrilles' },
  { id:'fougere',   label:'port en frondes pennées' }
];
const PREFIX = ['Vulpi','Cirsi','Anthe','Lyco','Sperma','Draco','Astra','Cauli','Nervi','Umbri','Salvi','Thala','Corni','Erya'];
const SUFFIX = ['anthus','folia','spina','rhiza','carpa','phylla','stemon','nervia','calyx','pogon'];
const LOCI = [
  'in rupibus calcareis, Vallis Umbrosa',
  'ad ripas fluminis Aquae Nigrae',
  'in pascuis siccis supra Montem Cinereum',
  'in fissuris muri antiqui, Hortus Vetus',
  'ad margines silvae, Saltus Boreus',
  'in arenosis maritimis, Litus Album',
  'in dumetis umbrosis prope Fontem Frigidam'
];
const NOTES = [
  'stipules caduques, à peine visibles',
  'odeur résineuse au froissement',
  'nervation saillante en dessous',
  'racine pivotante, très amère',
  'fleurs non observées sur ce pied',
  'exsiccatum légèrement décoloré',
  'limbe un peu charnu, sec cassant',
  'port couché à la base, redressé'
];
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

function normalize(w){
  return String(w||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); h ^= h>>>16; return h>>>0; };
}
function mulberry32(a){
  return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}
const r2 = n => Math.round(n*100)/100;
const jit = (rng,a) => (rng()*2-1)*a;
const RAD = Math.PI/180;

/* trait dessiné : polyligne lissée, jamais un segment droit */
function sk(pts, close){
  if (!pts || pts.length < 2) return '';
  let d = 'M'+r2(pts[0][0])+','+r2(pts[0][1]);
  for (let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    d += ' Q'+r2(pts[i][0])+','+r2(pts[i][1])+' '+r2(mx)+','+r2(my);
  }
  const L = pts[pts.length-1];
  d += ' Q'+r2(L[0])+','+r2(L[1])+' '+r2(L[0])+','+r2(L[1]);
  return close ? d+' Z' : d;
}
function nudge(pts, rng, amp){
  return pts.map(p => [p[0]+jit(rng,amp), p[1]+jit(rng,amp)]);
}
function stem(x, y, ang, len, bend, rng, jitter, n){
  const pts=[[x,y]]; let a=ang, cx=x, cy=y; const st=len/n;
  for (let i=0;i<n;i++){
    a += bend/n + jit(rng,jitter);
    cx += Math.cos(a*RAD)*st; cy += Math.sin(a*RAD)*st;
    pts.push([cx,cy]);
  }
  return { pts:pts, x:cx, y:cy, a:a };
}
function ribbon(pts, wFn){
  const R=[], L=[], n=pts.length;
  for (let i=0;i<n;i++){
    const t=i/(n-1), w=wFn(t), p=pts[i];
    const q=pts[Math.min(i+1,n-1)], o=pts[Math.max(i-1,0)];
    const dx=q[0]-o[0], dy=q[1]-o[1], m=Math.hypot(dx,dy)||1;
    R.push([p[0]-dy/m*w, p[1]+dx/m*w]);
    L.push([p[0]+dy/m*w, p[1]-dx/m*w]);
  }
  return R.concat(L.reverse());
}
function profile(kind, t){
  const s = Math.sin(Math.PI*t);
  if (kind==='lanceolee') return Math.pow(Math.sin(Math.PI*Math.pow(t,1.25)),1.7)*0.17;
  if (kind==='cordee')    return Math.sin(Math.PI*(0.16+0.84*t))*0.40;
  if (kind==='lineaire')  return Math.min(1,s*3.4)*0.1;
  if (kind==='spatulee')  return Math.pow(t,0.85)*s*0.44;
  if (kind==='obovale')   return Math.pow(t,0.45)*s*0.36;
  return Math.pow(s,0.86)*0.31; /* ovale */
}
/* un organe foliaire dessiné : contour irrégulier, marge, nervure, nervures secondaires, hachures */
function leafOrgan(kind, margin, size, rng, bend, veinCount){
  const n = 22, mid = [];
  let a = -90, cx = 0, cy = 0;
  for (let i=0;i<=n;i++){
    mid.push([cx,cy]);
    a += bend/n + jit(rng,0.5);
    cx += Math.cos(a*RAD)*(size/n); cy += Math.sin(a*RAD)*(size/n);
  }
  const teeth = margin==='dentee' ? 11 : margin==='lobee' ? 5 : 0;
  const amp   = margin==='dentee' ? 0.13 : margin==='lobee' ? 0.26 : 0;
  const wFn = t => {
    const base = profile(kind,t)*size;
    const m = teeth ? (1 + amp*Math.sin(t*teeth*Math.PI*2)) : 1;
    return Math.max(0.05, base*m + jit(rng, size*0.006));
  };
  const outline = nudge(ribbon(mid, wFn), rng, size*0.008);
  const veins = [];
  const nv = veinCount || 6;
  for (let i=1;i<=nv;i++){
    const t = 0.1 + (i/(nv+1))*0.82;
    const idx = Math.round(t*n);
    const p = mid[idx], q = mid[Math.min(n,idx+1)], o = mid[Math.max(0,idx-1)];
    const dx=q[0]-o[0], dy=q[1]-o[1], m=Math.hypot(dx,dy)||1;
    const w = wFn(t)*0.94, up = 0.34;
    for (const s of [1,-1]){
      const ex = p[0] - dy/m*w*s + (q[0]-p[0])*n*up*0.11;
      const ey = p[1] + dx/m*w*s + (q[1]-p[1])*n*up*0.11;
      veins.push(sk(nudge([p,[ (p[0]+ex)/2 + jit(rng,size*0.02), (p[1]+ey)/2 + jit(rng,size*0.02) ],[ex,ey]], rng, size*0.006)));
    }
  }
  const hatch = [];
  for (let i=0;i<5;i++){
    const t = 0.16 + i*0.12, idx = Math.round(t*n);
    const p = mid[idx], q = mid[Math.min(n,idx+1)], o = mid[Math.max(0,idx-1)];
    const dx=q[0]-o[0], dy=q[1]-o[1], m=Math.hypot(dx,dy)||1;
    const w = wFn(t)*0.72;
    hatch.push('M'+r2(p[0]-dy/m*w)+','+r2(p[1]+dx/m*w)+' L'+r2(p[0]+dy/m*w*0.25)+','+r2(p[1]-dx/m*w*0.25));
  }
  return { outline: sk(outline,true), outline2: sk(nudge(outline,rng,size*0.012),true), midrib: sk(nudge(mid,rng,size*0.006)), veins: veins, hatch: hatch, mid: mid, wFn: wFn };
}
function tendril(x, y, ang, size, rng){
  const pts=[]; let a=ang, cx=x, cy=y, st=size*0.16;
  for (let i=0;i<16;i++){ a += 26 + i*2.4 + jit(rng,4); cx += Math.cos(a*RAD)*st; cy += Math.sin(a*RAD)*st; st *= 0.93; pts.push([cx,cy]); }
  return sk(pts);
}

class Component extends DCLogic {
  state = { word:'Éléa', committed:'Éléa', variant:'mounted', settled:false, run:0 };
  svgRef = React.createRef();

  componentDidMount(){
    const p = {};
    if (this.props.word) { p.word = this.props.word; p.committed = this.props.word; }
    if (this.props.variant) p.variant = this.props.variant;
    if (Object.keys(p).length) this.setState(p);
    this.settle();
  }
  componentWillUnmount(){ clearTimeout(this._t); }
  settle(){
    clearTimeout(this._t);
    this.setState(s => ({ settled:false, run:s.run+1 }));
    this._t = setTimeout(() => this.setState({ settled:true }), 4600);
  }

  /* ── génération ───────────────────────────────────────────── */
  build(word){
    const norm = normalize(word) || 'siccus';
    const seed = xmur3(norm)();
    const rng = mulberry32(seed);
    const len = norm.replace(/\s/g,'').length;

    /* ORDRE DE CONSOMMATION FIGÉ — tout nouveau paramètre s'ajoute À LA FIN */
    const g = {};
    g.port        = PORTS[Math.floor(rng()*PORTS.length)];          // 1
    g.angleBase   = 18 + rng()*17;                                   // 2
    g.angleJitter = 0.10 + rng()*0.10;                               // 3
    g.branchRatio = 0.62 + rng()*0.16;                               // 4
    g.depth       = Math.min(11, Math.max(7, Math.round(6 + len*0.42 + rng()*1.6))); // 5
    g.curvature   = rng()*0.4;                                       // 6
    g.thickness   = 6 + rng()*4;                                     // 7
    g.phyllotaxy  = ['alterne','opposee','verticillee'][Math.floor(rng()*3)];        // 8
    g.leafType    = ['ovale','lanceolee','cordee','spatulee','obovale','lineaire'][Math.floor(rng()*6)]; // 9
    g.margin      = ['entiere','dentee','lobee'][Math.floor(rng()*3)];               // 10
    g.rootSpread  = 45 + rng()*25;                                   // 11
    const pal     = PALETTES[Math.floor(rng()*PALETTES.length)];     // 12
    g.leafBend    = jit(rng,26);                                     // 13
    g.leafSize    = g.thickness*2.9;
    /* l'organe réellement dessiné sur la plante — le détail agrandi doit être le même */
    g.organType   = g.port.id==='graminee' ? 'lineaire' : g.port.id==='fougere' ? 'lanceolee' : g.leafType;
    g.organMargin = g.port.id==='fougere' ? (g.margin==='entiere' ? 'dentee' : g.margin)
                  : g.port.id==='graminee' ? 'entiere' : g.margin;
    g.density     = Math.min(1, 0.52 + len/22);

    const strokes = [], organs = [], dots = [], marks = [];
    const push = (pts, w, wave, pass) => strokes.push({ d: sk(nudge(pts, rng, w*0.22)), w: Math.max(0.1,w), wave: wave, pass: pass||0 });
    const stemStroke = (s, w, wave) => { push(s.pts, w, wave); if (w > g.thickness*0.34) push(s.pts, w*0.42, wave, 1); };
    const organ = (x,y,ang,size,wave,kind,margin,veins) => organs.push({ x:x, y:y, ang:ang, wave:wave, size:size,
      o: leafOrgan(kind||g.organType, margin||g.organMargin, size, rng, g.leafBend, veins) });

    /* ── ports ── */
    let maxWave = 1;
    if (g.port.id === 'arbustif'){
      let frontier = [{x:0,y:0,a:-90,len:52,w:g.thickness}], total=0;
      for (let d=0; d<g.depth && frontier.length; d++){
        if (total + frontier.length > 1500) break;   /* coupe EN PROFONDEUR */
        const next=[];
        for (const nd of frontier){
          const sgn = d%2===0 ? 1 : -1;
          const s = stem(nd.x, nd.y, nd.a, nd.len, g.curvature*36*sgn, rng, 1.4, 5);
          stemStroke(s, nd.w, d); total++;
          if (d >= Math.floor(g.depth*0.34) && rng() < g.density){
            const nb = g.phyllotaxy==='verticillee' ? 3 : g.phyllotaxy==='opposee' ? 2 : 1;
            for (let k=0;k<nb;k++){
              const lean = (k - (nb-1)/2)*(g.phyllotaxy==='verticillee'?52:80) + jit(rng,18);
              organ(s.x, s.y, s.a+90+lean, g.leafSize*(0.7+rng()*0.6), d);
            }
          }
          if (d+1 < g.depth){
            const three = d>=2 && rng()<0.22;
            const angs = three ? [-g.angleBase, jit(rng,6), g.angleBase] : [-g.angleBase*0.6, g.angleBase*0.6];
            for (const b of angs) next.push({ x:s.x, y:s.y, a:s.a + b*(1+g.angleJitter*(rng()*2-1)), len:nd.len*(0.7+g.branchRatio*0.24), w:nd.w*g.branchRatio });
          }
        }
        frontier = next; maxWave = d+1;
      }
    } else if (g.port.id === 'rosette'){
      const nL = 7 + Math.floor(rng()*7);
      for (let i=0;i<nL;i++){
        const a = -172 + i*(164/(nL-1)) + jit(rng,7);
        const pl = 14 + rng()*22;
        const s = stem(0,0,a,pl, jit(rng,18), rng, 1.2, 4);
        stemStroke(s, g.thickness*0.28, Math.floor(i/3));
        organ(s.x, s.y, s.a, g.leafSize*(2.1+rng()*1.1), Math.floor(i/3), null, null, 8);
      }
      const scapes = 1 + Math.floor(rng()*2);
      for (let i=0;i<scapes;i++){
        const s = stem(jit(rng,6),0,-90+jit(rng,10), 96+rng()*46, jit(rng,26), rng, 1.6, 9);
        stemStroke(s, g.thickness*0.5, 4);
        const rays = 11 + Math.floor(rng()*9);
        for (let k=0;k<rays;k++){
          const a = -170 + k*(160/(rays-1)) + jit(rng,6), rl = 8+rng()*9;
          const e = [s.x + Math.cos(a*RAD)*rl, s.y + Math.sin(a*RAD)*rl];
          push([[s.x,s.y], e], g.thickness*0.11, 6);
          dots.push({ x:e[0], y:e[1], r:0.9+rng()*0.8, wave:7 });
        }
      }
      maxWave = 7;
    } else if (g.port.id === 'graminee'){
      const nB = 9 + Math.floor(rng()*8);
      for (let i=0;i<nB;i++){
        const side = i%2 ? 1 : -1;
        const a = -90 + side*(12+rng()*44);
        const s = stem(jit(rng,4),0,a, 76+rng()*66, side*(28+rng()*40), rng, 1.6, 12);
        organ(0,0,0,1,Math.floor(i/3));   /* placeholder remplacé ci-dessous */
        organs.pop();
        const bl = leafOrgan('lineaire','entiere',1,rng,0,3);
        const w0 = g.thickness*0.72;
        const outline = nudge(ribbon(s.pts, t => Math.max(0.12, w0*(1-t*0.94))), rng, 0.5);
        strokes.push({ d: sk(outline,true), w: g.thickness*0.16, wave: Math.floor(i/3), fillBlade:true });
        push(s.pts, g.thickness*0.09, Math.floor(i/3), 1);
      }
      const culms = 2 + Math.floor(rng()*3);
      for (let i=0;i<culms;i++){
        const s = stem(jit(rng,5),0,-90+jit(rng,8), 108+rng()*54, jit(rng,20), rng, 1.4, 10);
        stemStroke(s, g.thickness*0.32, 5);
        const nSp = 7 + Math.floor(rng()*7);
        for (let k=0;k<nSp;k++){
          const t = 0.5 + (k/nSp)*0.5, p = s.pts[Math.round(t*(s.pts.length-1))];
          const a = s.a + (k%2?1:-1)*(40+rng()*26);
          const sp = stem(p[0],p[1],a, 7+rng()*7, jit(rng,14), rng, 0.8, 3);
          push(sp.pts, 0.22, 6);
          dots.push({ x:sp.x, y:sp.y, r:1+rng()*0.7, wave:7 });
        }
      }
      maxWave = 7;
    } else if (g.port.id === 'grimpant'){
      let s = stem(0,0,-92+jit(rng,6), 74, 30*(rng()<0.5?1:-1), rng, 1.8, 8);
      stemStroke(s, g.thickness*0.62, 0);
      let node = s, wave = 0;
      const seg = 4 + Math.floor(rng()*3);
      for (let i=0;i<seg;i++){
        wave = i+1;
        const bend = (i%2===0?-1:1)*(26+rng()*32);
        const nx = stem(node.x, node.y, node.a, 44+rng()*18, bend, rng, 1.8, 8);
        stemStroke(nx, g.thickness*0.62*Math.pow(0.88,i+1), wave);
        for (let k=0;k<3;k++){
          const t = 0.22+k*0.32, p = nx.pts[Math.round(t*(nx.pts.length-1))];
          organ(p[0], p[1], nx.a + (k%2?96:-96) + jit(rng,16), g.leafSize*(1.5+rng()*0.7), wave, null, null, 8);
        }
        if (rng()<0.8) marks.push({ d: tendril(nx.x, nx.y, nx.a+(rng()<0.5?70:-70), 22+rng()*10, rng), wave: wave+1 });
        if (rng()<0.45){
          const br = stem(nx.pts[3][0], nx.pts[3][1], nx.a+(rng()<0.5?52:-52), 34+rng()*20, jit(rng,24), rng, 1.6, 6);
          stemStroke(br, g.thickness*0.24, wave+1);
          organ(br.x, br.y, br.a+80, g.leafSize*1.1, wave+1, null, null, 6);
        }
        node = nx;
      }
      maxWave = seg+2;
    } else {
      const nF = 5 + Math.floor(rng()*3);
      for (let i=0;i<nF;i++){
        const fan = (i/(nF-1))*2 - 1;               /* -1 → +1 : éventail de frondes */
        const a = -90 + fan*58 + jit(rng,5);
        const s = stem(jit(rng,4),0,a, 78+rng()*36, fan*(52+rng()*30) + jit(rng,8), rng, 1.4, 14);
        stemStroke(s, g.thickness*0.34, i);
        const nP = 11 + Math.floor(rng()*8);
        for (let k=0;k<nP;k++){
          const t = 0.12 + (k/nP)*0.85, idx = Math.round(t*(s.pts.length-1));
          const p = s.pts[idx], q = s.pts[Math.min(s.pts.length-1,idx+1)], o = s.pts[Math.max(0,idx-1)];
          const ang = Math.atan2(q[1]-o[1], q[0]-o[0])/RAD;
          const sz = g.leafSize*1.05*(1-t*0.5);
          for (const sd of [1,-1]) organ(p[0], p[1], ang + sd*(58+jit(rng,10)), sz, nF+Math.floor(t*4), null, null, 4);
        }
      }
      maxWave = nF+4;
    }

    /* ── racines ── */
    const fibrous = g.port.id==='graminee' || g.port.id==='rosette' || g.port.id==='fougere';
    if (fibrous){
      const nR = 12 + Math.floor(rng()*10);
      for (let i=0;i<nR;i++){
        const a = 90 + jit(rng, g.rootSpread);
        const s = stem(jit(rng,7), 0, a, 34+rng()*40, jit(rng,40), rng, 3.2, 8);
        push(s.pts, g.thickness*0.12, Math.floor(i/4));
        if (rng()<0.55){
          const b = stem(s.pts[4][0], s.pts[4][1], a+jit(rng,60), 14+rng()*18, jit(rng,30), rng, 3, 5);
          push(b.pts, g.thickness*0.08, Math.floor(i/4)+1);
        }
      }
    } else {
      let frontier = [{x:0,y:0,a:90,len:40,w:g.thickness*0.8}];
      const md = Math.max(4, Math.min(7, g.depth-3));
      for (let d=0; d<md && frontier.length; d++){
        const next=[];
        for (const nd of frontier){
          const s = stem(nd.x, nd.y, nd.a, nd.len, g.curvature*54*(d%2?-1:1), rng, 3, 6);
          stemStroke(s, nd.w, d);
          if (d+1 < md) for (const b of [-g.rootSpread*0.5, g.rootSpread*0.5, jit(rng,10)]) {
            if (rng()<0.78) next.push({ x:s.x, y:s.y, a:s.a+b*(1+g.angleJitter*(rng()*2-1)), len:nd.len*0.74, w:nd.w*g.branchRatio*0.84 });
          }
        }
        frontier = next;
      }
    }

    /* ── cadrage : bbox APRÈS génération ── */
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    const seePt = (x,y) => { if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; };
    for (const s of strokes){ const m = s.d.match(/-?\d+(\.\d+)?/g); if(!m) continue; for(let i=0;i<m.length-1;i+=2) seePt(+m[i], +m[i+1]); }
    for (const o of organs){
      const rr = o.size*0.62, ex = o.x + Math.cos((o.ang+90)*RAD)*o.size, ey = o.y + Math.sin((o.ang+90)*RAD)*o.size;
      seePt(o.x-rr, o.y-rr); seePt(o.x+rr, o.y+rr); seePt(ex-rr, ey-rr); seePt(ex+rr, ey+rr);
    }
    seePt(0,0);
    const bw = Math.max(30,(x1-x0))*1.14, bh = Math.max(30,(y1-y0))*1.08;
    const A = { x:24, y:44, w:158, h:262 };
    const sc = Math.min(A.w/bw, A.h/bh);
    const tx = A.x + A.w/2 - ((x0+x1)/2)*sc;
    const ty = A.y + A.h/2 - ((y0+y1)/2)*sc;

    /* ── nomenclature ── */
    const pfx = PREFIX[Math.floor(rng()*PREFIX.length)];
    const latinGenus = pfx + SUFFIX[Math.floor(rng()*SUFFIX.length)];
    const epithet = g.curvature > 0.28 ? 'contorta' : g.depth <= 7 ? 'nana'
                  : g.thickness < 7.5 ? 'gracilis' : g.phyllotaxy==='alterne' ? 'alterna' : 'robusta';
    const oldGenus = PREFIX[Math.floor(rng()*PREFIX.length)] + SUFFIX[Math.floor(rng()*SUFFIX.length)];
    const now = new Date();
    return {
      genome:g, pal:pal, seed:seed, strokes:strokes, organs:organs, dots:dots, marks:marks,
      maxWave: Math.max(2,maxWave), sc:sc, tx:tx, ty:ty, groundY:ty,
      latin: latinGenus.charAt(0).toUpperCase()+latinGenus.slice(1)+' '+epithet,
      oldName: oldGenus.charAt(0).toUpperCase()+oldGenus.slice(1)+' sp.',
      family: pfx + 'aceae',
      locus: LOCI[Math.floor(rng()*LOCI.length)],
      alt: (180 + Math.floor(rng()*1900)) + ' m',
      note: NOTES[Math.floor(rng()*NOTES.length)],
      note2: NOTES[Math.floor(rng()*NOTES.length)],
      detail2: ['coupe','graine','ombelle'][Math.floor(rng()*3)],
      specimen: 1000 + (seed % 9000),
      folio: 'f. ' + (1 + (seed % 240)),
      date: String(now.getDate()).padStart(2,'0')+'.'+ROMAN[now.getMonth()]+'.'+now.getFullYear(),
      stampAngle: -6 + (seed % 11)
    };
  }
  plate(){
    if (this._pw !== this.state.committed){ this._p = this.build(this.state.committed); this._pw = this.state.committed; }

  }

  clean(){
    const node = this.svgRef.current.cloneNode(true);
    node.querySelectorAll('*').forEach(el => { el.style.animation=''; el.style.opacity=''; });
    node.setAttribute('width','297mm'); node.setAttribute('height','420mm');
    return new XMLSerializer().serializeToString(node);
  }
  fileName(ext){ const p=this.plate(); return 'siccus-'+p.latin.toLowerCase().replace(/\s+/g,'-')+'-'+p.specimen+'.'+ext; }
  download(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  exportSvg = () => {
    const url = URL.createObjectURL(new Blob([this.clean()],{type:'image/svg+xml'}));
    this.download(url, this.fileName('svg')); setTimeout(()=>URL.revokeObjectURL(url),4000);
  };
  exportPng = () => {
    const svg = this.clean(), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width=297*4; c.height=420*4;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      this.download(c.toDataURL('image/png'), this.fileName('png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  };

    return React.createElement('g', { key:key, transform:t, style:st }, [
      React.createElement('path', { key:'f', d:o.o.outline, fill:wash, fillOpacity:0.22, stroke:'none' }),
      React.createElement('path', { key:'h', d:o.o.hatch.join(' '), fill:'none', stroke:ink, strokeWidth:r2(k*0.6), opacity:0.3 }),
      React.createElement('path', { key:'v', d:o.o.veins.join(' '), fill:'none', stroke:ink, strokeWidth:r2(k*0.7), opacity:0.55 }),

    ]);

  detailOrgan(kind, cx, cy, p, ink, wash, rng){
    const g = p.genome;
    if (kind === 'feuille'){

      ]);
    }
    if (kind === 'coupe'){

        const r = 22 - i*5.6, pts = [];
        for (let k=0;k<=26;k++){ const a=(k/26)*Math.PI*2; pts.push([Math.cos(a)*(r+jit(rng,0.5)), Math.sin(a)*(r+jit(rng,0.5))]); }

        parts.push(React.createElement('path', { key:'t'+i, fill:'none', stroke:ink, strokeWidth:0.2, opacity:0.5,
          d:'M'+r2(Math.cos(a)*11)+','+r2(Math.sin(a)*11)+' L'+r2(Math.cos(a)*16.4)+','+r2(Math.sin(a)*16.4) }));
      }
      return React.createElement('g', { key:'d2', transform:'translate('+cx+','+cy+')' }, parts);
    }

      }
      return React.createElement('g', { key:'d2', transform:'translate('+cx+','+r2(cy+14)+')' }, parts);
    }
    const pts=[], pts2=[];
    for (let k=0;k<=28;k++){ const a=(k/28)*Math.PI*2; pts.push([Math.cos(a)*(14+jit(rng,0.4)), Math.sin(a)*(20+jit(rng,0.5))]); }
    for (let k=0;k<=28;k++){ const a=(k/28)*Math.PI*2; pts2.push([Math.cos(a)*(14.9+jit(rng,0.5)), Math.sin(a)*(21+jit(rng,0.5))]); }
    const hs = [];
    for (let i=0;i<9;i++) hs.push('M'+r2(-11+i*2.6)+','+r2(-8+i*1.4)+' L'+r2(-4+i*2.6)+','+r2(2+i*1.4));
    return React.createElement('g', { key:'d2', transform:'translate('+cx+','+cy+')' }, [
      React.createElement('path', { key:'o', d:sk(pts,true), fill:wash, fillOpacity:0.2, stroke:ink, strokeWidth:0.5 }),
      React.createElement('path', { key:'o2', d:sk(pts2,true), fill:'none', stroke:ink, strokeWidth:0.22, opacity:0.45 }),
      React.createElement('path', { key:'h', d:hs.join(' '), fill:'none', stroke:ink, strokeWidth:0.2, opacity:0.4 }),
      React.createElement('path', { key:'x', d:'M-6,-13 Q4,0 -3,14', fill:'none', stroke:ink, strokeWidth:0.34, opacity:0.7 })
    ]);
  }
